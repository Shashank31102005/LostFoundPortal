<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Lost & Found Portal</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<header>

    <h1>🔐 Login</h1>

    <p>Welcome back to the Lost & Found Portal</p>

</header>


<main>

    <div class="card">

        <form method="POST">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <p style="margin-top: 20px;">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>


        <p style="margin-top: 15px;">

            <a href="{{ url_for('home') }}">
                ← Back to Home
            </a>

        </p>

    </div>

</main>

</body>

</html>
